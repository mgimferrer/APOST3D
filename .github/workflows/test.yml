name: APOST-3D build & test

# Runs the gfortran build and the full regression test suite (tests/manifest.json)
# on every push/PR to master and MAJOR-UPDATE, plus manual runs.
#
# IMPORTANT: this workflow never needs to change when tests are added or
# removed. `make test` discovers every case from tests/manifest.json at run
# time, so adding a new test is purely a data change:
#   1. drop SystemName.fchk / SystemName.inp into compiler-testset/
#   2. add a reference tests/reference/SystemName.apost
#   3. add an entry to tests/manifest.json
#   4. commit — CI picks it up automatically, no workflow edits required.
#
# `make test` always runs every case, no tiers. NTHREADS is set to the
# runner's core count to exercise the OpenMP paths and keep CI reasonably
# quick.

"on":
  push:
    branches: [master, MAJOR-UPDATE]
  pull_request:
    branches: [master, MAJOR-UPDATE]
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      APOST3D_PATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gfortran/gcc/make/openblas/cmake
        id: toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran gcc make libopenblas-dev cmake
          gfortran --version
          cmake --version
          echo "gfortran_version=$(gfortran -dumpfullversion)" >> "$GITHUB_OUTPUT"
          # Extracted from compile_libxc.sh itself (not duplicated here) so
          # bumping the pinned version there can never drift out of sync
          # with this cache key.
          libxc_version="$(grep -m1 '^LIBXC_VERSION=' compile_libxc.sh | sed -E 's/^LIBXC_VERSION="([^"]+)"/\1/')"
          echo "libxc_version=$libxc_version" >> "$GITHUB_OUTPUT"

      - name: Cache libxc build
        id: libxc-cache
        uses: actions/cache@v4
        with:
          path: libxc-${{ steps.toolchain.outputs.libxc_version }}
          # Cache key includes the *actual resolved* compiler version so a
          # gfortran upgrade on the runner image invalidates the cache
          # (.mod files aren't portable across compiler versions). Hashing
          # this workflow file instead of the real version (an earlier
          # approach) missed exactly that case: the runner image can bump
          # its default gfortran without this file ever changing, leaving
          # a stale cached libxc built by a now-mismatched compiler --
          # this is what broke run #53 (2026-08-30). Also keyed on the
          # pinned libxc version itself (not a tarball hash -- the source
          # tarball is fetched from upstream at build time, not committed)
          # so a future version bump correctly invalidates the cache too.
          key: libxc-${{ steps.toolchain.outputs.libxc_version }}-${{ runner.os }}-gfortran-${{ steps.toolchain.outputs.gfortran_version }}

      - name: Build libxc
        if: steps.libxc-cache.outputs.cache-hit != 'true'
        run: bash compile_libxc.sh

      - name: Build APOST-3D
        run: bash make_compile.sh

      - name: Run regression test suite
        run: make test NTHREADS=$(nproc)

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: tests/report/
          retention-days: 30

      - name: Keyword coverage report
        if: always()
        run: make coverage
